volumes:
  grafana-data:
  prometheus-data:    
  loki-data:
  shared_data:  # Volumen compartido entre ambos sniffers
    driver: local

services:
  loki:
    image: grafana/loki:2.8.2
    container_name: skafs_loki
    restart: unless-stopped
    volumes:
    - ./Monitoreo/loki-config.yml:/mnt/config/loki-config.yml
    - ./Monitoreo/loki-data:/tmp/loki
    ports:
    - 3100:3100
    command: 
    - '-config.file=/mnt/config/loki-config.yml'
    networks:
      - skafs_network
  
  grafana:
    image: grafana/grafana:10.0.2
    container_name: skafs_grafana
    restart: unless-stopped
    volumes:
    - ./Monitoreo/grafana-data:/var/lib/grafana
    ports:
    - 3000:3000
    networks:
      - skafs_network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: skafs_prometheus
    restart: unless-stopped
    volumes:
    - ./Monitoreo/prometheus.yml:/etc/prometheus/prometheus.yml
    - ./Monitoreo/prometheus-data:/prometheus
    ports:
    - 9090:9090
    command:
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--storage.tsdb.path=/prometheus'
    - '--storage.tsdb.retention.time=1y'
    - '--web.enable-lifecycle'
    networks:
      - skafs_network

  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.6.1
    container_name: skafs_node_exporter
    restart: unless-stopped
    ports:
    - 9100:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command: 
      - '--path.procfs=/host/proc' 
      - '--path.sysfs=/host/sys'
      - --collector.processes
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    networks:
      - skafs_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.1
    container_name: skafs_cadvisor
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      # Monta el sistema de archivos raíz del host
      - /:/rootfs:ro
      # Monta el socket de Docker para obtener información en tiempo real
      - /var/run:/var/run:rw
      # Monta los datos de Docker para acceder a los metadatos de contenedores
      - /var/lib/docker:/var/lib/docker:ro
      # Proporciona acceso a las estadísticas del kernel
      - /sys:/sys:ro
    privileged: true
    networks:
      - skafs_network

  locust:
    build:
      context: ./Sniffing
      dockerfile: Dockerfile.locust
    image: skafs-locust-image  # Opcional: nombre para la imagen construida
    ports:
      - "8089:8089"
      - "5557:5557"
      - "5558:5558"
    networks:
      - skafs_network
    command: >
      --host skafs-gateway
      --web-port 8089
      --locustfile /scripts/load_tests.py
    environment:
      - LOCUST_LOCUSTFILE=/scripts/load_tests.py
      - LOCUST_WEB_PORT=8089
    depends_on:
      - skafs-gateway

  locust-metrics-exporter:
    image: containersol/locust_exporter
    ports:
      - "9646:9646"
    networks:
      - skafs_network
    environment:
      - LOCUST_EXPORTER_WEB_LISTEN_ADDRESS=:9646
      - LOCUST_EXPORTER_WEB_TELEMETRY_PATH=/metrics
      - LOCUST_EXPORTER_URI=http://locust:8089
      - LOCUST_EXPORTER_LOG_LEVEL=debug
    depends_on:
      - locust  # Espera a que Locust esté listo antes de iniciar

  skafs-cloud:
    build:
      context: ./IoT
      dockerfile: ./cloud/SKAFS/Dockerfile
    container_name: skafs-cloud
    networks:
      - skafs_network
    volumes:
      - ./Logs:/logs
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"  
    ports:
      - 8011:8011 #Prometheus
      - 5001:5001 #Socket
    command: ["python", "-m", "cloud.skafs_cloud"]
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 10M

  skafs-gateway:
    build:
      context: ./IoT
      dockerfile: ./gateway/SKAFS/Dockerfile
    container_name: skafs-gateway
    depends_on:
      - skafs-cloud
    networks:
      - skafs_network
    volumes:
      - ./Logs:/logs
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"  
    ports:
      - 8010:8010 #Prometheus
      - 5000:5000 #Socket
    command: ["python", "-m", "gateway.skafs_gateway"]
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 10M
  
  
  skafs-device:
    build:
      context: ./IoT
      dockerfile: ./device/SKAFS/Dockerfile
    depends_on:
      - skafs-gateway
    networks:
      - skafs_network
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"  
    volumes:
      - ./Logs:/logs
    ports:
      - 8012:8012 #Prometheus
    command: ["python", "-m", "device.skafs_device"]
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 10M

  sniffer-capture:
    build:
      context: ./Sniffing
      dockerfile: Dockerfile.capture
    network_mode: host # Capturar tráfico del host
    volumes:
      - ./Sniffing/shared_data:/shared_data  # Volumen compartido
      - ./Logs:/logs
    cap_add:
      - NET_ADMIN # Permiso para sniffing
    command: [ "python", "-m", "capture_script" ]
    restart: on-failure

  sniffer-replicate:
    build:
      context: ./Sniffing
      dockerfile: Dockerfile.replicate
    networks:
      - skafs_network
    volumes:
      - ./Sniffing/shared_data:/shared_data  # Mismo volumen compartido
      - ./Logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"  # Exponer el puerto de FastAPI
    command: ["uvicorn", "replicate_script:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: on-failure

networks:
  skafs_network:
    driver: bridge
